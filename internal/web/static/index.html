<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神仙道助手 (sxd-pie-ng) - 控制台</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --indigo: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    h1 { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-success { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .badge-warn { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
    .badge-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .badge-info { background: rgba(59, 130, 246, 0.2); color: var(--primary); }
    .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 1000px) {
      .grid { grid-template-columns: 1fr 1.3fr; }
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th, td { padding: 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-weight: 600; }
    .log-box {
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      height: 320px;
      overflow-y: auto;
    }
    .log-entry { margin-bottom: 4px; display: flex; gap: 8px; }
    .log-time { color: var(--text-muted); }
    .log-level-INFO { color: #60a5fa; }
    .log-level-WARN { color: var(--warning); }
    .log-level-ERROR { color: var(--danger); }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-secondary { background: #334155; }
    .btn-success { background: #059669; }
    .btn:hover { opacity: 0.9; }
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .filter-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .routine-list {
      max-height: 480px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .routine-item {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .routine-meta { display: flex; flex-direction: column; gap: 2px; }
    .routine-name { font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
    .routine-desc { font-size: 0.75rem; color: var(--text-muted); }
    .toggle {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #475569; transition: .3s; border-radius: 22px;
    }
    .slider:before {
      position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--success); }
    input:checked + .slider:before { transform: translateX(18px); }
    .role-select {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 0.8rem;
      max-width: 180px;
    }
    .role-count { font-size: 0.7rem; color: var(--text-muted); font-weight: normal; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>神仙道助手 (sxd-pie-ng) <span class="badge badge-success" id="sys-status">ONLINE</span></h1>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">全量 30+ 自动化矩阵 · 双轨复合调度 · 语义智能熔断</p>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="btn btn-secondary" onclick="fetchData()">刷新</button>
    </div>
  </header>

  <div class="grid">
    <div>
      <!-- 角色面板 -->
      <div class="card">
        <div class="card-title">
          <span>🎮 角色会话列表</span>
          <span style="font-size: 0.8rem; color: var(--text-muted);" id="role-count">共 0 个角色</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>角色名</th>
              <th>区服</th>
              <th>会话状态</th>
            </tr>
          </thead>
          <tbody id="roles-tbody">
            <tr><td colspan="3" style="text-align: center; color: var(--text-muted);">暂无角色会话</td></tr>
          </tbody>
        </table>
      </div>

      <!-- 实时日志面板 -->
      <div class="card" style="margin-top: 20px;">
        <div class="card-title">
          <span>📜 实时系统日志</span>
          <span style="font-size: 0.8rem; color: var(--text-muted);">动态环形缓冲</span>
        </div>
        <div class="log-box" id="log-box">
          <div class="log-entry"><span class="log-time">--:--:--</span><span class="log-level-INFO">[INFO]</span><span>控制台初始化就绪，等待日志数据...</span></div>
        </div>
      </div>
    </div>

    <!-- 玩法矩阵管理面板 -->
    <div class="card">
      <div class="card-title">
        <span>⚡ 自动化玩法矩阵 (30+ 玩法)</span>
        <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
          <select id="routine-role" class="role-select" onchange="changeRoutineRole(this.value)" title="选择要单独调整的角色；选择“全部角色”时开关对所有角色生效">
            <option value="">全部角色 (全局)</option>
          </select>
          <button class="btn btn-success" onclick="applyPreset('recommended')">一键减负预设</button>
          <button class="btn btn-secondary" onclick="applyPreset('all')">全开</button>
          <button class="btn btn-secondary" onclick="applyPreset('none')">全关</button>
        </div>
      </div>

      <div class="filter-bar" id="domain-filters">
        <button class="filter-btn active" onclick="filterDomain('all')">全部</button>
        <button class="filter-btn" onclick="filterDomain('daily')">每日日常</button>
        <button class="filter-btn" onclick="filterDomain('farming')">农场资源</button>
        <button class="filter-btn" onclick="filterDomain('social')">仙盟社交</button>
        <button class="filter-btn" onclick="filterDomain('dungeon')">副本推图</button>
        <button class="filter-btn" onclick="filterDomain('pvp')">竞技对抗</button>
        <button class="filter-btn" onclick="filterDomain('minigame')">益智问答</button>
      </div>

      <div class="routine-list" id="routine-list">
        <div style="text-align: center; color: var(--text-muted); padding: 20px;">正在加载玩法矩阵...</div>
      </div>
    </div>
  </div>

  <script>
    let allRoles = [];
    let allRoutines = [];
    let currentDomain = 'all';
    let selectedRoleId = '';

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[ch]);
    }

    async function fetchData() {
      try {
        const routinesURL = '/api/routines' + (selectedRoleId ? '?role_id=' + encodeURIComponent(selectedRoleId) : '');
        const [rolesRes, logsRes, routinesRes] = await Promise.all([
          fetch('/api/roles'),
          fetch('/api/logs'),
          fetch(routinesURL)
        ]);
        if (rolesRes.ok) {
          allRoles = await rolesRes.json();
          renderRoles(allRoles);
          renderRoleFilter();
        }
        if (logsRes.ok) {
          renderLogs(await logsRes.json());
        }
        if (routinesRes.ok) {
          allRoutines = await routinesRes.json();
          renderRoutines();
        }
      } catch (e) {
        console.error("加载数据异常", e);
      }
    }

    function renderRoles(roles) {
      const tbody = document.getElementById('roles-tbody');
      document.getElementById('role-count').innerText = `共 ${roles.length} 个角色`;
      if (!roles || roles.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">暂无角色会话</td></tr>';
        return;
      }
      tbody.innerHTML = roles.map(r => `
        <tr>
          <td><strong>${escapeHtml(r.role_name)}</strong></td>
          <td>${escapeHtml(r.server_id)}</td>
          <td><span class="badge ${r.state === 'Active' ? 'badge-success' : (r.state === 'Closed' ? 'badge-danger' : 'badge-warn')}">${escapeHtml(r.state)}</span></td>
        </tr>
      `).join('');
    }

    function renderRoleFilter() {
      const sel = document.getElementById('routine-role');
      if (!sel) return;
      const signature = allRoles.map(r => `${r.role_id}:${r.role_name}:${r.server_id}`).join('|');
      if (sel.dataset.signature !== signature) {
        sel.innerHTML = '<option value="">全部角色 (全局)</option>' + allRoles.map(r =>
          `<option value="${escapeHtml(r.role_id)}">${escapeHtml(r.role_name)} · ${escapeHtml(r.server_id)}</option>`
        ).join('');
        sel.dataset.signature = signature;
      }
      if (selectedRoleId && !allRoles.some(r => r.role_id === selectedRoleId)) {
        selectedRoleId = '';
      }
      sel.value = selectedRoleId;
    }

    function changeRoutineRole(roleID) {
      selectedRoleId = roleID;
      fetchData();
    }

    function renderLogs(logs) {
      const box = document.getElementById('log-box');
      if (!logs || logs.length === 0) return;
      box.innerHTML = logs.map(l => `
        <div class="log-entry">
          <span class="log-time">${l.time}</span>
          <span class="log-level-${l.level}">[${l.level}]</span>
          <span>${l.message}</span>
        </div>
      `).join('');
      box.scrollTop = box.scrollHeight;
    }

    function filterDomain(domain) {
      currentDomain = domain;
      document.querySelectorAll('#domain-filters .filter-btn').forEach(b => {
        b.classList.remove('active');
        if (b.innerText.toLowerCase().includes(domain) || (domain === 'all' && b.innerText === '全部')) {
          b.classList.add('active');
        }
      });
      renderRoutines();
    }

    function renderRoutines() {
      const container = document.getElementById('routine-list');
      if (!allRoutines || allRoutines.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px;">暂无玩法配置</div>';
        return;
      }

      const filtered = currentDomain === 'all' 
        ? allRoutines 
        : allRoutines.filter(r => r.domain === currentDomain);

      container.innerHTML = filtered.map(r => {
        const roleSummary = (!selectedRoleId && r.roles && r.roles.length > 0)
          ? ` · <span class="role-count">${r.roles.filter(x => x.enabled).length}/${r.roles.length} 个角色启用</span>`
          : '';
        return `
        <div class="routine-item">
          <div class="routine-meta">
            <div class="routine-name">
              <span>${escapeHtml(r.name)}</span>
              <span class="badge ${r.state === 'Cooling' ? 'badge-warn' : (r.enabled ? 'badge-success' : 'badge-danger')}">
                ${r.state === 'Cooling' ? '熔断休眠中' : (r.enabled ? '运行中' : '已停用')}
              </span>
            </div>
            <div class="routine-desc">${escapeHtml(r.description || r.id)}${roleSummary}</div>
          </div>
          <div>
            <label class="toggle">
              <input type="checkbox" ${r.enabled ? 'checked' : ''} onchange="toggleRoutine('${escapeHtml(r.id)}', this.checked)">
              <span class="slider"></span>
            </label>
          </div>
        </div>
      `;
      }).join('');
    }

    async function toggleRoutine(id, enabled) {
      try {
        await fetch('/api/routines', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ role_id: selectedRoleId, id, enabled })
        });
        fetchData();
      } catch (e) {
        console.error("切换状态异常", e);
      }
    }

    async function applyPreset(preset) {
      try {
        const scope = selectedRoleId ? `角色 ${selectedRoleId}` : '全部角色';
        if (!confirm(`确认对 ${scope} 应用预设「${preset}」？`)) {
          return;
        }
        await fetch('/api/routines', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ role_id: selectedRoleId, preset })
        });
        fetchData();
      } catch (e) {
        console.error("应用预设异常", e);
      }
    }

    fetchData();
    setInterval(fetchData, 2000);
  </script>
</body>
</html>
