# 神仙道助手 (sxd-pie-ng) 示例配置文件
# 详见 docs/ 了解具体配置项说明

server:
  port: 8080
  host: "127.0.0.1"

# 本地文件日志配置 (按大小与时间双维度自动轮转，每次启动也会归档一次旧日志，默认保存 INFO 及以上级别日志)
log:
  enabled: true                 # 是否启用本地文件日志 (默认 true)
  dir: "logs"                   # 日志存放目录
  file: "sxd.log"               # 当前活动日志文件名
  level: "info"                 # 写入文件的最低级别: debug / info / warn / error
  format: "text"                # 输出格式: text / json
  max_size_mb: 10               # 单文件大小上限 (MB)，超过后立即轮转
  rotate_interval: "24h"        # 时间轮转周期，如 24h / 1h；设置为 "0" 关闭时间轮转
  max_backups: 10               # 最多保留的历史日志文件数量 (0 表示不限制)
  max_age_days: 30              # 历史日志最长保留天数 (0 表示不限制)

accounts:
  - platform: "xindong"
    username: "YOUR_PLATFORM_USERNAME"
    password: "${PLATFORM_PASSWORD}"
    # 心动平台通行证 Cookie (可选，用于绕过图形验证码风控并实现全自动进服与掉线重连)
    # 格式例如: "A1=xxxxxx; A2=yyyyyy"
    cookie: ""
    roles:
      - server_id: "s0"        # 区服ID，如测试1服为 "s0"，双线1区为 "s1"
        role_name: "YOUR_ROLE_NAME"
        auto_login: true

scheduler:
  jitter:
    min_seconds: 1.0
    max_seconds: 3.0
  routines:
    # 基础自动化模块
    dungeon: true               # 副本推图与扫荡 (统一命名为 dungeon)
    daily_sign_in: true         # 每日签到 (Module 89，仅活动开启时领取，不消耗元宝)
    vip_welfare: true           # VIP每日免费礼包 (仅领免费档，永不购买付费礼包)
    online_reward: true         # 在线奖励一键领取 (按在线时长解锁，含元宝档位)
    world_boss: true            # 世界Boss自动参战 (仅开战期免费战斗，不消耗元宝)
    mail_collect: true          # 邮件一键收取 (打开邮箱面板后一键领取全部邮件附件)
    six_realms: true            # 六道轮回爬塔与灵件处理 (每日免费重置/自动爬塔/蓝装自动出售)
    town_practice: true         # 城镇打坐练功 (上线自动结算并领取离线经验)
    beelzebub_trials: true      # 魔王试炼 (自建队伍、招募助战镜像、挑战每日魔王并领道行奖励)
    training_room: true         # 仙界练功房 (领取累积经验并维持最佳空闲席位)
    lucky_star: true            # 吉星高照 (个人摇骰子与免费逆天改运)
    faction_lucky_star: true    # 帮派吉星高照 (帮派成员成绩与排名奖励)
    scratch_card: true          # 幸运刮刮卡 (仅用每日免费次数，可刮出元宝)
    crystal_mine: false                  # 仙界矿山开采 (待补全实现)
    gourd_realm: true                   # 壶中界仙葫芦 (按日领取累积收益)
    rune_refine: false                  # 符文炼化 (待补全实现)
    guild_activities: true                   # 仙盟日常 (先探测开放/入盟状态)
    sacred_alliance: true                   # 圣盟日常 (先探测赛季/开放状态)
    homestead: true                   # 住宅玩法 (先探测婚姻/开放状态)
    friendship: true                   # 好友来信 (已解锁自动阅读并领奖)
    fame_blessing: true                   # 仙界尊像膜拜 (仅用免费白檀香)
    zodiac_challenge: true                   # 生肖挑战 (挑战前校验等级)
    spirit_trial: false                  # 精灵试炼扫荡 (待补全实现)
    gods_and_demons: false                  # 神魔大战阵营 (待补全实现)
    cross_server_ladder: false                  # 跨服天梯排位 (待补全实现)
    imperial_exam: false                  # 金榜题名会试 (待补全实现)
    partner_guess: false                  # 伙伴猜猜看 (待补全实现)
    fishing: true                   # 自动钓鱼命格 (免费鱼钩，自动下钩)
    ice_cave: true                   # 一键冰窟探险 (未开放自动跳过)
    ask_fairy: true             # 每日问灵 (免费1次，随机奖励优先元宝)
    device_bind_reward: true    # 设备绑定奖励 (绑定手机后自动领首绑/月度元宝)
    faction_blessing: true      # 帮派祭神 (每日免费上香获取祝福/声望/神像灵气)
    faction_lucky_wheel: true   # 帮派转盘 (消耗青龙令自动抽奖)
    travel_event: true          # 仙旅奇缘 (世界地图每日事件，按收益权重自动抉择分支)
    pilgrimage: true            # 取经/护送/打劫
    arena: true                 # 本服竞技场
    celestial_arena: true       # 仙界竞技场 (跨服积分赛自动挑战，不消耗元宝)

    # 18项抓包与日常核心功能
    online_gift: true           # 1. 领取奖励 (在线礼包 + 全部功能终结礼包)
    jieyuan_box: true           # 2. 结缘宝箱 (除了传说，其他都开)
    daily_quest: true           # 3. 领取日活跃奖励
    qimen_dunjia: true          # 4. 奇门遁甲
    spirit_pool: true           # 5. 淬炼粗铁 / 洗灵
    god_bless: true             # 6. 天神赐福
    caravan_hijack: true        # 7. 劫镖
    xunxian_road: true          # 8. 寻仙之路
    demon_tower: true           # 9. 锁妖塔
    era_travel: true            # 10. 山河游历
    lingdao_practice: true      # 11. 灵道初解
    huanshou_invade: true       # 12. 山海幻兽
    herb_garden: true           # 13. 药园种植
    wufa_field: true            # 14. 悟法领域 (按面板免费次数抽卡，不消耗元宝)
    master_practice: true       # 15. 宗师修行
    treasure_house: true        # 16. 天帝宝库
    find_immortal: true         # 17. 喜从天降 (画龙鱼，只走免费流程)
    five_blessings: true        # 18. 五福临门 (每日免费祈福，只走免费流程)

  # 副本与推图自动化策略配置 (包含推图与扫荡两大核心功能)
  dungeon:
    # 功能一：剧情推图 (循环接任务/做任务/交任务直至无任务可做)
    quest_cycle:
      enabled: true             # 启用任务闭环推图
      auto_replenish_stamina: true  # 自动吃药补充体力 (仅作用于推图)
      max_replenish_stamina: 200    # 单次推图最大补充体力上限 (点数，仅作用于推图；包子5/粽子10/茶叶蛋50)

    # 功能二：关卡扫荡 (扫荡每日精英副本)
    sweep:
      enabled: true             # 启用关卡扫荡
      pipeline:                 # 扫荡策略流水线 (仅 sweep_elite)
        - "sweep_elite"         # 1. 扫荡精英 (清空每日可用英雄/精英副本)
      sell_swept_items: true    # 扫荡后是否自动卖掉扫荡物 (默认 true)
      max_batch_times: 10       # 单次批处理最大扫荡次数 (仅作用于扫荡)
      prefer_practice_quickly: true # 优先使用 Module 25 秒完成协议 (仅作用于扫荡)

  # 六道轮回爬塔与封灵灵件自动化策略配置
  six_realms:
    auto_reset: true            # 当前道全通后是否自动消耗每日免费次数重置 (默认 true)
    auto_sell_blue: true        # 挑战关卡获胜后是否自动卖出蓝色灵件 (默认 true)
    auto_sell_purple: false     # 挑战关卡获胜后是否自动卖出紫色灵件 (默认 false，保留紫色封灵灵件)

  # 西天取经护送与打劫策略配置 (仅使用免费次数，不消耗元宝)
  pilgrimage:
    auto_rob: true              # 启程护送后是否自动打劫取经路上其他玩家队伍 (默认 true)
    max_rob_attempts: 5         # 单轮最多尝试打劫次数 (1-5，默认 5)
    max_probe_targets: 8        # 单轮最多探测的目标队伍数量 (1-50，默认 8)

  # 魔王试炼自动化策略配置
  beelzebub_trials:
    prefer_boss_id: 0           # 优先挑战的魔王编号 (0 表示自动选择最高难度魔王；如指定 72 为魔掌门神识)
    auto_moral_award: true      # 战斗后自动查询并领取道行等级宝箱奖励
    min_level: 0                # 开启等级门槛 (0 表示由服务端资格检查自动决定，不设客户端硬编码限制)

  # 仙界练功房挂机收益维护配置 (跨服玩法，仅使用免费争夺次数)
  training_room:
    allow_rob_seat: false       # 是否抢夺已满员的高星席位 (默认 false，只占空闲席位)
    max_rob_attempts: 1         # 单轮巡检最多争夺次数 (仅 allow_rob_seat=true 时生效)

  # 结缘宝箱配置 (每批最多10个，除了传说其他都开)
  jieyuan_box:
    max_batch_size: 10          # 每批最多开启数量 (上限 10 个)

  # 帮派祭神上香配置
  faction_blessing:
    offering_id: 1              # 供品编号 (1 白檀香免费 / 2 苏合香30元宝 / 3 天木香90元宝)
    allow_cover: false          # 剩余祝福次数高于本次上香收益时是否允许覆盖 (默认 false，避免浪费)

  # 天帝宝库自选三档大奖配置
  treasure_house:
    interactive: true           # 开启交互式选奖：先向服务端拉取刷新候选奖池，并在控制台提示交互输入选择
    # 自选三档大奖默认道具ID (非交互模式或交互直接回车时的预设值)
    tier1_item_id: 50           # 一档自选大奖道具ID (默认 50)
    tier2_item_id: 25           # 二档自选大奖道具ID (默认 25)
    tier3_item_id: 42           # 三档自选大奖道具ID (默认 42)
    max_draw_times: 10          # 单次最大连续抽奖轮数 (钥匙耗尽自动退出)

  # 个人吉星高照自动化策略配置 (仅使用免费逆天改运次数，永不消耗元宝)
  lucky_star:
    max_rerolls_per_roll: 9     # 每次投掷最大逆天改运次数 (客户端上限 9)

  # 在线礼包与功能终结礼包配置
  # 功能终结礼包: 吉星高照、喜从天降(龙鱼仙令/境界点)、灵脉、拜关公、聚灵等
  # 玩法达到等级上限终结后转为每日领取的补偿礼包 (Mod_FunctionEnd, Module 127)
  online_gift:
    claim_function_end_gifts: true  # 是否领取功能终结礼包 (默认 true)
    max_claims_per_gift: 20         # 单个礼包连续领取次数上限 (默认 20)
    # 注意: 服务端标记需要消耗元宝的终结礼包 (如吉星高照) 一律跳过，不提供花元宝开关。

  # 喜从天降与五福临门均无策略参数，也不会消耗元宝：
  # - 喜从天降：查询龙鱼令数量后串行召唤并领奖，直到龙鱼令耗尽；
  # - 五福临门：只使用每日免费祈福次数并立即领奖。
