# 神仙道助手 (sxd-pie-ng) 脱敏示例配置
# 由实际运行配置同步生成；账号、密码、Cookie、角色名均已替换为占位符。
# 复制为 configs/config.yaml 并填写真实凭据后即可运行。

server:
  port: 8080
  host: "127.0.0.1"

# 本地文件日志配置 (按大小与时间双维度自动轮转，每次启动也会归档一次旧日志)
log:
  enabled: true                 # 是否启用本地文件日志 (默认 true)
  dir: "logs"                   # 日志存放目录
  file: "sxd.log"               # 当前活动日志文件名
  level: "info"                 # 写入文件的最低级别: debug / info / warn / error
  format: "text"                # 输出格式: text / json
  max_size_mb: 10               # 单文件大小上限 (MB)，超过后立即轮转
  rotate_interval: "24h"        # 时间轮转周期，如 24h / 1h；设置为 "0" 关闭时间轮转
  max_backups: 10               # 最多保留的历史日志文件数量 (0 表示不限制)
  max_age_days: 30              # 历史日志最长保留天数 (0 表示不限制)

accounts:
  - platform: "xindong"
    username: "YOUR_PLATFORM_USERNAME"
    password: "${PLATFORM_PASSWORD}"
    # 填入您在 Chrome 中登录后控制台/Cookie 中的 A1、A2 值
    # 示例: "A1=xxxxxx; A2=yyyyyy" (可绕过图形验证码风控，长效数周自动重连)
    cookie: ""
    roles:
      - server_id: "s0"        # 测试1服
        role_name: "YOUR_ROLE_NAME"
        auto_login: true
      - server_id: "s1"        # 正式1服
        role_name: "YOUR_SECOND_ROLE_NAME"
        auto_login: true

scheduler:
  # ── 基础调度 ────────────────────────────────────────────────
  jitter:
    min_seconds: 1.0
    max_seconds: 3.0

  # 多区服换票串行间隔 (秒)，避免同一账号短时间多次 Web 登录触发风控
  startup:
    ticket_min_interval_seconds: 2
    ticket_max_interval_seconds: 5

  # ── 玩法开关 ────────────────────────────────────────────────
  # 按六大领域分组；true=启用，false=停用。未列出的玩法按默认开关执行。
  routines:
    # 【日常 daily】签到、日常、邮件、福利、打坐
    daily_sign_in: true           # 每日签到与更新福利礼包
    daily_quest: true             # 小助手日常活跃度与常规跑环
    mail_collect: true            # 邮件/好友信件附件一键领取
    online_gift: true             # 在线礼包 + 功能终结礼包
    vip_welfare: true             # VIP每日免费礼包与官职俸禄
    god_bless: true               # 跨服天神赐福
    online_reward: true           # 在线时长奖励一键领取
    courtyard_pet: true           # 宠物灵符召唤 (仅 call(NORMAL), 不消耗元宝)
    weekend_event: true           # 周末狂欢礼 + 水果机 (仅免费次数, 不消耗元宝)
    daoyuan_vip_shop: true        # 精品杂货 VIP5/VIP8 购买 (仅低价档, 不消耗元宝)
    void_worship: true            # 仙界虚空/大神榜膜拜 (每日免费一次)
    sa_union_worship: true
    sa_world_tower: true          # 全网幻魔塔 (免费挑战, 不买次数)        # 万古神墟/圣盟膜拜 (仅铜钱档)
    device_bind_reward: true      # 手机绑定首绑/月度奖励
    town_practice: true           # 城镇打坐离线经验结算
    partner_practice: true        # 幻境修炼开始/结算 (免费)
    expedition: true              # 仙界远征任务派遣 (免费)
    fairyland_dispatch: true      # 宠物仙域游历 (免费)
    three_world: true             # 三界/人界修炼 (免费)
    destiny_sword: true           # 飞剑剑意淬炼
    daily_gifts: true             # 每日俸禄/灵石/PC微端礼包
    saint_practice: true          # 圣域免费修炼房
    dragonball_offer: true        # 神龙普通上供 (铜钱)
    fate_hunt: true               # 免费猎命 + 命宫碎片兑换
    children_daily: false         # 孩子功能: 按用户要求关闭
    rebirth_land: true             # 轮回净地免费挂机奖励 (不消耗元宝)
    activity_report: true         # 每日活跃度汇总 (只读)
    tactics_water: true           # 兵法圣水购买 (铜钱，不消耗元宝)
    partner_link_box: true        # 缘魂宝箱购买 (道缘/铜钱，不消耗元宝)
    xiudan: true                  # 服用修为丹 (背包已有道具，不消耗元宝)

    # 【农场 farming】药园、取经、矿山、淬炼、壶中界、符文
    herb_garden: true             # 药园播种/施肥/除草/采摘
    pilgrimage: true              # 西天取经护送与打劫
    crystal_mine: true            # 仙界矿山开采与守护
    spirit_pool: true             # 异兽喂养与淬炼池提炼
    refine_pot: true              # 灵霄宝殿炼宝炉 (材料>=500, 不消耗元宝)
    gourd_realm: true             # 壶中界灵气转化/炼丹/融合
    rune_refine: true             # 符文淬炼与八卦炉提纯

    # 【社交 social】仙盟、圣盟、住宅、好友、帮派
    guild_activities: true        # 仙盟捐献/神兽/魔神
    sacred_alliance: true         # 圣盟祭祀/幻魔塔/商店
    homestead: true               # 住宅家具祝福/夫妻宝箱
    friendship: true              # 好友送花/结义羁绊
    fame_blessing: true           # 仙界尊像膜拜
    jieyuan_box: true             # 结缘宝箱批量开启
    faction_blessing: true        # 帮派祭神上香 (免费白檀香)
    faction_lucky_wheel: true     # 帮派转盘 (青龙令)
    collection_booklets: true     # 神仙收藏册声望奖励
    npc_friendship: true          # NPC结交与铜钱伴手礼
    marry_home: true              # 家园小蛋糕奖励 (免费, 非活动时间跳过)
    sect_monster: true            # 宗门灵兽免费喂养 (仙盟城镇会话)

    # 【副本 dungeon】推图、扫荡、爬塔、练功房、试炼
    dungeon: true                 # 剧情推图 + 精英副本扫荡
    six_realms: true              # 六道轮回爬塔与灵件处理
    demon_tower: true             # 伏魔锁妖塔挑战
    training_room: true           # 仙界练功房挂机收益
    zodiac_challenge: true        # 生肖挑战与金油炼化
    spirit_trial: true            # 精灵试炼扫荡
    qimen_dunjia: true            # 奇门遁甲法阵注灵
    xunxian_road: false           # 寻仙之路推图 (当前关闭)
    beelzebub_trials: true        # 魔王试炼与道行奖励
    tong_tian_tower: true         # 通天塔逐层挑战/突破
    nine_regions: true            # 九空无界: 自动建队/助战并挑战当前关卡 (不消耗元宝)

    # 【竞技 pvp】竞技场、阵营、Boss、天梯
    arena: true                   # 本服竞技场
    celestial_arena: true         # 仙界竞技场
    holy_arena: true              # 圣域竞技场 (免费席位)
    gods_and_demons: true         # 神魔大战阵营参战
    caravan_hijack: true          # 阵营劫镖拦截
    world_boss: true              # 世界Boss准点参战
    cross_server_ladder: true     # 跨服天梯排位

    # 【小游戏 minigame】摇奖、答题、钓鱼、免费福利
    lucky_star: true              # 个人吉星高照 (免费改运)
    faction_lucky_star: true      # 帮派吉星高照
    travel_event: true            # 仙旅奇缘事件抉择
    imperial_exam: true           # 金榜题名智能答题
    partner_guess: true           # 伙伴猜猜看
    fishing: true                 # 自动钓鱼与命格融合
    scratch_card: true            # 幸运刮刮卡免费次数
    ask_fairy: true               # 每日问灵 (优先元宝)
    golden_touch_stone: true      # 点金石
    forbidden_book: true          # 禁地之书 (免费优先)
    ice_cave: true                # 一键冰窟探险
    era_travel: true              # 山河纪元游历
    lingdao_practice: true        # 灵道初解修炼
    huanshou_invade: true         # 山海幻兽入侵
    wufa_field: true              # 悟法领域感悟
    master_practice: true         # 宗师修行 (神器绝技切换职业)
    treasure_house: true          # 天帝宝库自选大奖
    find_immortal: true           # 喜从天降 (免费龙鱼令)
    five_blessings: true          # 五福临门免费祈福
    find_beast: true              # 寻找异兽免费次数
    duobao_mountain: true         # 多宝山免费挖掘
    eudemons: true                # 幻兽经脉激活
    partner_link: true            # 灵结激活
    star_picture: true            # 法力星图: 仅 has_divination=0 且 free>0 时占星一次, 不循环不买次数
    bailian: true                 # 百炼乾坤一/二一键挑战 (免费)
    soul_hunt: true               # 灵域猎妖免费挑战 (不买次数)
    era_creation: true            # 纪元造化秘境探索+挑战 (免费)
    cultivation_card: true        # 神仙卡牌收藏集 (仅铜钱商城, 不消耗元宝)
    fortune_box: true             # 奇缘宝藏 (免费开箱)
    era_yanjie: true               # 纪元湮劫每日一关战斗 (免费)
    era_treasure: true            # 纪元秘藏/轮回图录奖励 (免费)
    mystic_hunt: true              # 仙幽猎境入口开放时免费进入
    get_peach: true                # 摘仙桃: 摘取已召唤仙桃 + 铜钱/免费次数召唤 (不消耗元宝)
    pet_animal: true               # 叶公好龙普通培养: 仅铜钱培养 (不消耗元宝)
    lucky_shop: false             # 琳琅阁: 按用户要求禁用 (无实现, 保留开关)

  # ── 副本 / 挑战策略 ─────────────────────────────────────────
  dungeon:
    # 剧情推图：循环接任务/做任务/交任务，直至无任务可做
    quest_cycle:
      enabled: true
      auto_replenish_stamina: true    # 推图体力不足时自动吃药
      max_replenish_stamina: 200      # 单次推图最大补体力 (包子5/粽子10/茶叶蛋50)
    # 关卡扫荡：精英/英雄副本按城镇全量扫荡
    sweep:
      enabled: true                   # true=开启扫荡；只测剧情推图时可改为 false
      pipeline:
        - "sweep_elite"               # 扫荡精英副本
      sell_swept_items: true          # 扫荡后自动出售扫荡物
      prefer_practice_quickly: true   # 优先使用秒完成协议

  six_realms:
    auto_reset: true                  # 通关后自动用免费次数重置
    auto_sell_blue: true              # 自动出售蓝色灵件
    auto_sell_purple: true            # 自动出售紫色灵件 (false=保留)
    max_floor_retries: 3              # 每层最大重试次数

  # 魔王试炼自动化策略
  beelzebub_trials:
    prefer_boss_id: 0                 # 0=自动选择最高难度；可指定魔王编号
    auto_moral_award: true            # 自动领取道行等级宝箱
    min_level: 0                      # 0=由服务端资格检查决定

  # ── 农场 / 取经策略 ─────────────────────────────────────────
  # 西天取经护送与打劫 (仅使用免费次数，不消耗元宝)
  pilgrimage:
    auto_rob: true                    # 启程后自动打劫其他玩家队伍
    max_rob_attempts: 5               # 单轮最多打劫次数 (1-5)
    max_probe_targets: 8              # 单轮最多探测目标数 (1-50)
    # 圣域通道回退策略: 不配置=自动 (推荐)。圣域功能已开放的角色只走圣域，
    # 圣域关闭/维护时跳过本轮；圣域功能未开放的角色回退仙界跨服/主服取经。
    # force_saint_area: true          # 强制固定圣域，永不回退
    # force_saint_area: false         # 总是允许回退仙界跨服/主服

  # 粗铁淬炼池 (固定铜钱消耗，永不消耗元宝)
  spirit_pool:
    refine_target: "xuantie"          # xuantie=淬炼玄铁 / lingcai=提炼灵材

  # ── 社交 / 帮派策略 ─────────────────────────────────────────
  # 结缘宝箱 (每批最多 10 个，除传说外全部开启)
  jieyuan_box:
    max_batch_size: 10

  # 帮派祭神上香
  faction_blessing:
    offering_id: 1                    # 1=白檀香免费 / 2=苏合香30元宝 / 3=天木香90元宝
    allow_cover: false                # 剩余祝福更高时是否仍覆盖 (默认 false)

  # ── 小游戏 / 福利策略 ───────────────────────────────────────
  # 宗师修行：每日最多 3 次挑战；当前职业满星后按 practice_order 切换职业。
  master_practice:
    practice_order: []               # 留空=只练主角当前职业；示例 [15, 1, 2, 3, 6, 5]
    max_challenges_per_day: 3        # 每日挑战次数上限 (线上实测 3 次)
    max_stars_per_job: 30            # 单方向累计星数上限
    auto_normalize_deploy: true      # 自动下阵异职业伙伴、上阵同职业伙伴
    allow_switch_stunt: true         # 允许切换主角神器绝技转换职业
    allow_step_up: true              # 挑战后自动尝试境界突破
    max_retries_per_star: 2          # 单个星级挑战失败后的重试次数
    switch_job_on_failure: true      # 重试耗尽仍打不过时切换到其他可修行职业

  # 天帝宝库三档自选大奖
  treasure_house:
    # auto: 按账号养成进度动态计算需求分；prefer_awards 为采集失败时的兜底顺序
    # 条目: 9 永恒灵宝 / 12 血魂石 / 26 鸿蒙紫气 / 23 大法力石
    #       18 超级火龙珠 / 51 1阶宝石随机包 / 34 普通进阶丹 / 42 境界点
    selection_mode: auto
    interactive: false
    prefer_awards: [9, 12, 26, 23, 18, 51, 34, 42]
    max_draw_times: 10                # 单次最大抽奖轮数

  # 个人吉星高照 (仅使用免费逆天改运次数)
  lucky_star:
    max_rerolls_per_roll: 9           # 每次投掷最大改运次数 (客户端上限 9)

  # 在线礼包 + 功能终结礼包；消耗元宝的终结礼包一律跳过
  online_gift:
    claim_function_end_gifts: true    # 领取功能终结礼包
    max_claims_per_gift: 20           # 单个礼包连续领取上限

  # 说明: 喜从天降、五福临门无策略参数，仅使用免费次数，不消耗元宝。

  # ── 多区服覆盖 ──────────────────────────────────────────────
  # s0/s1 当前均继承全局配置。如需按区服覆盖，可填写：
  #   s1:
  #     dungeon:
  #       sweep:
  #         enabled: false
  #     treasure_house:
  #       selection_mode: explicit
  #       award_ids: [4, 21, 33]
  server_overrides:
    s0:
    s1:
